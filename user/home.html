<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mahi Shopy - Home</title>
  <link rel="stylesheet" href="../theme-toggle.css" />
  <script src="../theme-toggle.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #000000;
      color: #ffffff;
    }
    header {
      background-color: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      color: white;
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    nav {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      flex-wrap: wrap;
    }
    nav button {
      background: transparent;
      border: 2px solid transparent;
      color: #ffffff;
      font-size: 0.95rem;
      cursor: pointer;
      padding: 0.5rem 0.9rem;
      border-radius: 6px;
      position: relative;
      transition: all 0.3s ease;
      font-weight: bold;
      letter-spacing: 1px;
      animation: borderGlow 3s linear infinite;
    }

    @keyframes borderGlow {
      0% {
        border-color: #ffffff;
        box-shadow: 0 0 5px #ffffff, 0 0 10px #ffffff;
      }
      50% {
        border-color: #cccccc;
        box-shadow: 0 0 15px #ffffff, 0 0 20px #ffffff;
      }
      100% {
        border-color: #ffffff;
        box-shadow: 0 0 5px #ffffff, 0 0 10px #ffffff;
      }
    }
    nav button:hover {
      background-color: rgba(255, 255, 255, 0.2);
    }

    .zudio-highlight {
      border: 2px solid yellow;
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      animation: borderLoop 3s linear infinite;
      display: inline-block;
      color: black;
      font-weight: bold;
    }
    .zudio-header-highlight {
      border: 2px solid #007bff;
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
      animation: borderLoopBlue 3s linear infinite;
      display: inline-block;
      color: white;
      font-weight: bold;
    }
    @keyframes borderLoop {
      0% {
        box-shadow: 0 0 5px yellow, 0 0 10px yellow;
        border-color: yellow;
      }
      50% {
        box-shadow: 0 0 15px yellow, 0 0 20px yellow;
        border-color: orange;
      }
      100% {
        box-shadow: 0 0 5px yellow, 0 0 10px yellow;
        border-color: yellow;
      }
    }
    @keyframes borderLoopBlue {
      0% {
        box-shadow: 0 0 5px #007bff, 0 0 10px #007bff;
        border-color: #007bff;
      }
      50% {
        box-shadow: 0 0 15px #0056b3, 0 0 20px #0056b3;
        border-color: #0056b3;
      }
      100% {
        box-shadow: 0 0 5px #007bff, 0 0 10px #007bff;
        border-color: #007bff;
      }
    }

    #logoutBtn {
      background-color: #dc3545;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
      color: white;
      transition: background-color 0.3s ease;
    }
    #logoutBtn:hover {
      background-color: #c82333;
    }
    main {
      padding: 2rem;
      text-align: left;
      color: #ffffff;
    }
    main h1 {
      display: inline-block;
      padding: 0.5rem 3rem 0.5rem 1rem;
      border: 2px solid #000000;
      border-radius: 8px;
      position: relative;
      font-weight: bold;
      letter-spacing: 2px;
      color: #000000;
      background-color: #ffffff;
    }
    h2 {
      text-align: left;
      max-width: 1200px;
      margin: 2rem auto 1rem auto;
      color: #ffffff;
      text-shadow: 0 0 8px #ffffff, 0 0 12px #ffffff;
      animation: glow 2s ease-in-out infinite alternate;
      font-weight: bold;
      letter-spacing: 1.5px;
    }

    @keyframes glow {
      from {
        text-shadow: 0 0 8px #ffffff, 0 0 12px #ffffff;
      }
      to {
        text-shadow: 0 0 20px #ffffff, 0 0 30px #ffffff;
      }
    }
    .items-container {
      max-width: 1200px;
      margin: 0 auto 2rem auto;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: flex-start;
    }
    .item {
      background: white;
      padding: 1rem;
      margin-bottom: 1rem;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: calc(20% - 1rem);
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transition: box-shadow 0.3s ease;
      color: #000000;
    }
    .item:hover {
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
    }
    .item h3 {
      margin: 0 0 0.5rem 0;
      color: #000000;
      font-size: 1.05rem;
    }
    .item p {
      margin: 0 0 0.5rem 0;
      color: #555555;
      font-size: 0.85rem;
    }
    .item .price {
      font-weight: bold;
      color: #007bff;
      font-size: 1rem;
    }
    .item button {
      margin: 0.25rem 0.35rem;
      padding: 0.4rem 0.8rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .buy-btn {
      background-color: #28a745;
      color: white;
    }
    .buy-btn:hover {
      background-color: #218838;
    }
    .cart-btn {
      background-color: #007bff;
      color: white;
    }
    .cart-btn:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <video autoplay muted loop id="backgroundVideo" playsinline style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: -1; pointer-events: none;">
    <source src="../a.mp4" type="video/mp4" />
    Your browser does not support the video tag.
  </video>
  <header>
    <nav style="display: flex; align-items: center; gap: 0.8rem; color: white; font-weight: bold; font-size: 1.2rem; flex-wrap: wrap;">
      <a href="home.html" id="zudioLogo" style="font-size: 1.8rem; font-weight: bold; color: white; text-decoration: none; cursor: pointer; margin-right: 1.5rem;"><span class="zudio-header-highlight">Mahi Shopy</span></a>
      <button id="homeBtn" style="background: transparent; border: none; color: white; font-size: 1rem; cursor: pointer; padding: 0.5rem 0.8rem; border-radius: 4px;">Home</button>
      <button id="profileBtn" style="background: transparent; border: none; color: white; font-size: 1rem; cursor: pointer; padding: 0.5rem 0.8rem; border-radius: 4px;">👤 Profile</button>
      <button id="mensWearBtn">Mens Wear</button>
      <button id="womensWearBtn">Womens Wear</button>
      <button id="kidsBoysBtn">Kids Wear (Boys)</button>
      <button id="kidsGirlsBtn">Kids Wear (Girls)</button>
      <button id="cartBtn" style="background-color: #ffc107; color: black; border-radius: 6px; padding: 0.5rem 1rem; border: none; cursor: pointer; font-weight: bold; animation: none;">
        🛒 Cart <span id="cartCountBadge" style="background: black; color: white; border-radius: 999px; padding: 0.15rem 0.45rem; font-size: 0.75rem; margin-left: 4px;">0</span>
      </button>
    </nav>
    <div class="header-right-actions">
      <a href="profile.html" id="userProfileDisplay" class="user-profile-badge" title="View Profile">
        <img id="userPhoto" src="" alt="User Photo" class="user-profile-avatar" style="display: none;" />
        <span id="userDefaultIcon">👤</span>
        <span id="userNameDisplay">Profile</span>
      </a>
      <button id="logoutBtn" style="background-color: #dc3545; color: white; border: none; border-radius: 9999px; padding: 0.5rem 1rem; font-weight: bold; cursor: pointer;">Logout</button>
    </div>
  </header>
  <main>
    <h1>Welcome to <span class="zudio-highlight">Mahi Shopy</span></h1>

    <!-- Carousel Section -->
    <section id="productCarousel" style="max-width: 100%; margin: 0 auto 2rem auto; position: relative; overflow: hidden;">
      <h2 style="color: black; text-shadow: none;">Top Picks</h2>
      <div id="carouselContainer" style="display: flex; gap: 1rem; transition: transform 0.5s ease; width: 100%;">
        <!-- Carousel items will be injected here -->
      </div>
      <button id="carouselPrev" style="position: absolute; top: 50%; left: 0; transform: translateY(-50%); background-color: rgba(0,0,0,0.5); color: white; border: none; padding: 0.5rem; cursor: pointer;">&#10094;</button>
      <button id="carouselNext" style="position: absolute; top: 50%; right: 0; transform: translateY(-50%); background-color: rgba(0,0,0,0.5); color: white; border: none; padding: 0.5rem; cursor: pointer;">&#10095;</button>
    </section>

    <p>Select a category from the header above.</p>

    <h2 style="color: black; text-shadow: none;">Featured Womens Wear</h2>
    <div class="items-container" id="womensItemsContainer">
      <p class="message" id="loadingWomensMessage">Loading items...</p>
    </div>

    <h2 style="color: black; text-shadow: none;">Featured Mens Wear</h2>
    <div class="items-container" id="mensItemsContainer">
      <p class="message" id="loadingMensMessage">Loading items...</p>
    </div>

    <h2 style="color: black; text-shadow: none;">Featured Kids Wear (Boys)</h2>
    <div class="items-container" id="kidsBoysItemsContainer">
      <p class="message" id="loadingKidsBoysMessage">Loading items...</p>
    </div>

    <h2 style="color: black; text-shadow: none;">Featured Kids Wear (Girls)</h2>
    <div class="items-container" id="kidsGirlsItemsContainer">
      <p class="message" id="loadingKidsGirlsMessage">Loading items...</p>
    </div>
  </main>

  <!-- Firebase App (the core Firebase SDK) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <!-- Firebase Authentication -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <!-- Firebase Database -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <!-- Shared Store Adapter -->
  <script src="../shared-store.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCXdyiJmfEFPCQJwwjRDQfXt9RIKLTRpxU",
      authDomain: "amazom-d71c3.firebaseapp.com",
      projectId: "amazom-d71c3",
      storageBucket: "amazom-d71c3.firebasestorage.app",
      messagingSenderId: "1001190970236",
      appId: "1:1001190970236:web:625930553721a5fcba8af9",
      measurementId: "G-8CE41Q0YXC"
    };

    // Initialize Firebase
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const database = firebase.database();

    // Cache of loaded category items
    const categoryCache = {};

    // Auth state handler
    auth.onAuthStateChanged(user => {
      const userNameDisplay = document.getElementById('userNameDisplay');
      const userPhoto = document.getElementById('userPhoto');
      if (user) {
        database.ref('users/' + user.uid).once('value').then(snapshot => {
          const data = snapshot.val();
          if (data && data.name) {
            userNameDisplay.textContent = `Hello, ${data.name}`;
          } else {
            userNameDisplay.textContent = `Hello, ${user.email ? user.email.split('@')[0] : 'User'}`;
          }
          if (data && data.photoUrl) {
            userPhoto.src = data.photoUrl;
            userPhoto.style.display = 'block';
          }
        }).catch(() => {
          userNameDisplay.textContent = `Hello, ${user.email ? user.email.split('@')[0] : 'User'}`;
        });
      } else {
        if (userNameDisplay) userNameDisplay.textContent = 'Guest';
      }
    });

    // Utility function to display items in a container
    function displayItems(containerId, items, loadingMessageId) {
      const container = document.getElementById(containerId);
      const loadingMessage = document.getElementById(loadingMessageId);
      if (loadingMessage) loadingMessage.style.display = 'none';
      if (!container) return;
      container.innerHTML = '';
      if (!items || Object.keys(items).length === 0) {
        container.innerHTML = '<p class="message">No items found.</p>';
        return;
      }
      categoryCache[containerId] = items;
      const keys = Object.keys(items).slice(0, 10); // Display up to 10 items
      keys.forEach(key => {
        const item = items[key];
        const itemDiv = document.createElement('div');
        itemDiv.className = 'item';
        itemDiv.innerHTML = `
          <h3>${item.name}</h3>
          <p>${item.description}</p>
          ${item.imageUrl ? `<img src="${item.imageUrl}" alt="${item.name}" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600&auto=format&fit=crop&q=80';" style="width:100%; height:180px; object-fit: cover; margin-bottom: 0.5rem; border-radius: 6px;" />` : ''}
          <p class="price">$${Number(item.price).toFixed(2)}</p>
          <div>
            <button class="buy-btn" data-key="${key}" data-category="${containerId}">Buy</button>
            <button class="cart-btn" data-key="${key}" data-category="${containerId}">Add to Cart</button>
          </div>
        `;
        container.appendChild(itemDiv);
      });
    }

    // Function to update cart badge count
    function updateCartBadge() {
      const badge = document.getElementById('cartCountBadge');
      if (badge && window.MahiStore) {
        badge.textContent = window.MahiStore.getCartCount();
      }
    }

    // Floating Toast Notification
    function showToast(name) {
      let toast = document.getElementById('homeToastMsg');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'homeToastMsg';
        toast.style.cssText = 'position: fixed; bottom: 25px; right: 25px; background: rgba(15, 23, 42, 0.95); border: 1px solid #00f2fe; color: white; padding: 12px 20px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 10000; font-weight: 600; display: flex; align-items: center; gap: 12px; backdrop-filter: blur(10px);';
        document.body.appendChild(toast);
      }
      toast.innerHTML = `
        <span>🛍️ Added <b>${name}</b> to bag!</span>
        <a href="cart.html" style="background: linear-gradient(135deg, #4facfe, #00f2fe); color: black; padding: 4px 10px; border-radius: 6px; text-decoration: none; font-size: 0.82rem; font-weight: 700;">View Cart</a>
      `;
      toast.style.display = 'flex';
      setTimeout(() => { toast.style.display = 'none'; }, 3500);
    }

    // Global Buy / Cart click listener
    document.addEventListener('click', (e) => {
      const buyBtn = e.target.closest('.buy-btn');
      const cartBtn = e.target.closest('.cart-btn');

      if (buyBtn) {
        const key = buyBtn.getAttribute('data-key');
        const catId = buyBtn.getAttribute('data-category');
        let item = null;
        if (catId && categoryCache[catId]) {
          item = categoryCache[catId][key];
        }
        if (!item && window.allStoreProducts) {
          item = window.allStoreProducts.find(p => p._key === key || p.name === key);
        }
        if (item) {
          if (window.MahiStore) {
            window.MahiStore.addToCart(item, 1);
          }
          window.location.href = 'cart.html';
        }
      } else if (cartBtn) {
        const key = cartBtn.getAttribute('data-key');
        const catId = cartBtn.getAttribute('data-category');
        let item = null;
        if (catId && categoryCache[catId]) {
          item = categoryCache[catId][key];
        }
        if (!item && window.allStoreProducts) {
          item = window.allStoreProducts.find(p => p._key === key || p.name === key);
        }
        if (item) {
          if (window.MahiStore) {
            window.MahiStore.addToCart(item, 1);
          }
          updateCartBadge();
          showToast(item.name);
        }
      }
    });

    // Update cart badge on load and on custom event
    window.addEventListener('cartUpdated', updateCartBadge);
    updateCartBadge();

    // Fetch and display items for each category using store
    ZudioStore.bindCategory('womens_wear', (data) => {
      displayItems('womensItemsContainer', data, 'loadingWomensMessage');
    });
    ZudioStore.bindCategory('mens_wear', (data) => {
      displayItems('mensItemsContainer', data, 'loadingMensMessage');
    });
    ZudioStore.bindCategory('kids_boys_wear', (data) => {
      displayItems('kidsBoysItemsContainer', data, 'loadingKidsBoysMessage');
    });
    ZudioStore.bindCategory('kids_girls_wear', (data) => {
      displayItems('kidsGirlsItemsContainer', data, 'loadingKidsGirlsMessage');
    });

    // Top picks carousel
    function fetchCarouselProducts() {
      ZudioStore.getAllProducts((allProducts) => {
        if (allProducts && allProducts.length > 0) {
          window.allStoreProducts = allProducts;
          displayCarousel(allProducts);
        }
      });
    }

    function displayCarousel(products) {
      const carouselContainer = document.getElementById('carouselContainer');
      if (!carouselContainer || products.length === 0) return;
      let currentIndex = 0;
      const visibleCount = Math.min(5, products.length);

      function render() {
        carouselContainer.innerHTML = '';
        for (let i = 0; i < visibleCount; i++) {
          const product = products[(currentIndex + i) % products.length];
          const itemDiv = document.createElement('div');
          itemDiv.className = 'item';
          itemDiv.style.flex = '1 0 18%';
          itemDiv.innerHTML = `
            <h3>${product.name}</h3>
            <p>${product.description}</p>
            ${product.imageUrl ? `<img src="${product.imageUrl}" alt="${product.name}" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600&auto=format&fit=crop&q=80';" style="width:100%; height:180px; object-fit: cover; margin-bottom: 0.5rem; border-radius: 6px;" />` : ''}
            <p class="price">$${Number(product.price).toFixed(2)}</p>
            <div>
              <button class="buy-btn" data-key="${product._key || product.name}" data-category="${product._category || ''}">Buy</button>
              <button class="cart-btn" data-key="${product._key || product.name}" data-category="${product._category || ''}">Add to Cart</button>
            </div>
          `;
          carouselContainer.appendChild(itemDiv);
        }
      }

      const prevBtn = document.getElementById('carouselPrev');
      const nextBtn = document.getElementById('carouselNext');

      if (prevBtn) {
        prevBtn.onclick = () => {
          currentIndex = (currentIndex - 1 + products.length) % products.length;
          render();
        };
      }

      if (nextBtn) {
        nextBtn.onclick = () => {
          currentIndex = (currentIndex + 1) % products.length;
          render();
        };
      }

      render();

      // Auto change carousel every 3.5 seconds
      setInterval(() => {
        currentIndex = (currentIndex + 1) % products.length;
        render();
      }, 3500);
    }

    fetchCarouselProducts();

    // Navigation button handlers
    const zudioLogo = document.getElementById('zudioLogo');
    if (zudioLogo) zudioLogo.addEventListener('click', (e) => { e.preventDefault(); window.location.href = 'home.html'; });
    const homeBtn = document.getElementById('homeBtn');
    if (homeBtn) homeBtn.addEventListener('click', () => { window.location.href = 'home.html'; });
    const profileBtn = document.getElementById('profileBtn');
    if (profileBtn) profileBtn.addEventListener('click', () => { window.location.href = 'profile.html'; });
    const mensWearBtn = document.getElementById('mensWearBtn');
    if (mensWearBtn) mensWearBtn.addEventListener('click', () => { window.location.href = 'mens_wear.html'; });
    const womensWearBtn = document.getElementById('womensWearBtn');
    if (womensWearBtn) womensWearBtn.addEventListener('click', () => { window.location.href = 'womens.html'; });
    const kidsBoysBtn = document.getElementById('kidsBoysBtn');
    if (kidsBoysBtn) kidsBoysBtn.addEventListener('click', () => { window.location.href = 'kids_boys.html'; });
    const kidsGirlsBtn = document.getElementById('kidsGirlsBtn');
    if (kidsGirlsBtn) kidsGirlsBtn.addEventListener('click', () => { window.location.href = 'kids_girls.html'; });
    const cartBtn = document.getElementById('cartBtn');
    if (cartBtn) cartBtn.addEventListener('click', () => { window.location.href = 'cart.html'; });

    // Logout button
    const logoutBtn = document.getElementById('logoutBtn');
    if (logoutBtn) {
      logoutBtn.addEventListener('click', () => {
        auth.signOut().then(() => {
          window.location.href = 'login.html';
        });
      });
    }
  </script>
</body>
</html>
