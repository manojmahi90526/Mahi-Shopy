<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kids Girls Wear User Page</title>
  <link rel="stylesheet" href="../theme-toggle.css" />
  <script src="../theme-toggle.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #000000;
      color: #ffffff;
    }
    header {
      background-color: #000000;
      color: white;
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    nav {
      display: flex;
      gap: 1rem;
    }
    nav button {
      background: transparent;
      border: none;
      color: #ffffff;
      font-size: 1rem;
      cursor: pointer;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      transition: background-color 0.3s ease;
    }
    nav button:hover {
      background-color: rgba(255, 255, 255, 0.2);
    }
    #logoutBtn {
      background-color: #dc3545;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
      color: white;
      transition: background-color 0.3s ease;
    }
    #logoutBtn:hover {
      background-color: #c82333;
    }
    h2 {
      text-align: center;
      margin-bottom: 1rem;
    }
    .items-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
    }
    .item {
      background: white;
      padding: 1rem;
      margin-bottom: 1rem;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: calc(20% - 1rem);
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .item h3 {
      margin: 0 0 0.5rem 0;
    }
    .item p {
      margin: 0 0 0.5rem 0;
    }
    .item .price {
      font-weight: bold;
      color: #007bff;
    }
    .item button {
      margin: 0.25rem 0.5rem;
      padding: 0.4rem 0.8rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .buy-btn {
      background-color: #28a745;
      color: white;
    }
    .buy-btn:hover {
      background-color: #218838;
    }
    .cart-btn {
      background-color: #007bff;
      color: white;
    }
    .cart-btn:hover {
      background-color: #0056b3;
    }
    .message {
      text-align: center;
      font-weight: bold;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <video autoplay muted loop id="backgroundVideo" style="position: fixed; right: 0; bottom: 0; min-width: 100%; min-height: 100%; object-fit: cover; z-index: -1;">
    <source src="3753687-uhd_3840_2160_25fps.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>
  <header>
    <nav style="display: flex; align-items: center; gap: 0.8rem; color: white; font-weight: bold; font-size: 1.2rem; flex-wrap: wrap;">
      <a href="home.html" style="font-size: 1.8rem; font-weight: bold; color: white; text-decoration: none; cursor: pointer; margin-right: 1.5rem;"><span class="zudio-header-highlight">Mahi Shopy</span></a>
      <button id="homeBtn" style="background: transparent; border: none; color: white; font-size: 1rem; cursor: pointer; padding: 0.5rem 0.8rem; border-radius: 4px;">Home</button>
      <button id="profileBtn" style="background: transparent; border: none; color: white; font-size: 1rem; cursor: pointer; padding: 0.5rem 0.8rem; border-radius: 4px;">👤 Profile</button>
      <button id="mensWearBtn" style="background-color: #000408; color: white; border-radius: 4px; padding: 0.5rem 1rem; border: none; cursor: pointer;">Mens Wear</button>
      <button id="womensWearBtn" style="background-color: #000409; color: white; border-radius: 4px; padding: 0.5rem 1rem; border: none; cursor: pointer;">Womens Wear</button>
      <button id="kidsBoysBtn" style="background-color: #00060c; color: white; border-radius: 4px; padding: 0.5rem 1rem; border: none; cursor: pointer;">Kids Wear (Boys)</button>
      <button id="kidsGirlsBtn" style="background-color: #000a13; color: white; border-radius: 4px; padding: 0.5rem 1rem; border: none; cursor: pointer;">Kids Wear (Girls)</button>
      <button id="cartBtn" style="background-color: #ffc107; color: black; border-radius: 6px; padding: 0.5rem 1rem; border: none; cursor: pointer; font-weight: bold;">🛒 Cart <span id="cartCountBadge" style="background: black; color: white; border-radius: 999px; padding: 0.15rem 0.45rem; font-size: 0.75rem; margin-left: 4px;">0</span></button>
    </nav>
    <div class="header-right-actions">
      <a href="profile.html" id="userProfileDisplay" class="user-profile-badge" title="View Profile">
        <img id="userPhoto" src="" alt="User Photo" class="user-profile-avatar" style="display: none;" />
        <span id="userDefaultIcon">👤</span>
        <span id="userNameDisplay">Profile</span>
      </a>
      <button id="logoutBtn" style="background-color: #dc3545; color: white; border: none; border-radius: 9999px; padding: 0.5rem 1rem; font-weight: bold; cursor: pointer;">Logout</button>
    </div>
  </header>

  <script>
    document.getElementById('cartBtn').addEventListener('click', () => {
      window.location.href = 'cart.html';
    });
    document.getElementById('homeBtn').addEventListener('click', () => {
      window.location.href = 'home.html';
    });
    document.getElementById('profileBtn').addEventListener('click', () => {
      window.location.href = 'profile.html';
    });
  </script>
  <h2>Kids Girls Wear Items</h2>
  <div class="items-container" id="itemsContainer">
    <p class="message" id="loadingMessage">Loading items...</p>
  </div>

  <!-- Firebase App (the core Firebase SDK) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <!-- Firebase Authentication -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <!-- Firebase Database -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <!-- Shared Store Adapter -->
  <script src="../shared-store.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCXdyiJmfEFPCQJwwjRDQfXt9RIKLTRpxU",
      authDomain: "amazom-d71c3.firebaseapp.com",
      projectId: "amazom-d71c3",
      storageBucket: "amazom-d71c3.firebasestorage.app",
      messagingSenderId: "1001190970236",
      appId: "1:1001190970236:web:625930553721a5fcba8af9",
      measurementId: "G-8CE41Q0YXC"
    };

    // Initialize Firebase
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const database = firebase.database();

    const itemsContainer = document.getElementById('itemsContainer');
    const loadingMessage = document.getElementById('loadingMessage');
    let currentItemsMap = {};

    function updateCartBadge() {
      const badge = document.getElementById('cartCountBadge');
      if (badge && window.MahiStore) {
        badge.textContent = window.MahiStore.getCartCount();
      }
    }
    window.addEventListener('cartUpdated', updateCartBadge);
    updateCartBadge();

    function showToast(name) {
      let toast = document.getElementById('pageToastMsg');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'pageToastMsg';
        toast.style.cssText = 'position: fixed; bottom: 25px; right: 25px; background: rgba(15, 23, 42, 0.95); border: 1px solid #00f2fe; color: white; padding: 12px 20px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 10000; font-weight: 600; display: flex; align-items: center; gap: 12px; backdrop-filter: blur(10px);';
        document.body.appendChild(toast);
      }
      toast.innerHTML = `
        <span>🛍️ Added <b>${name}</b> to bag!</span>
        <a href="cart.html" style="background: linear-gradient(135deg, #4facfe, #00f2fe); color: black; padding: 4px 10px; border-radius: 6px; text-decoration: none; font-size: 0.82rem; font-weight: 700;">View Cart</a>
      `;
      toast.style.display = 'flex';
      setTimeout(() => { toast.style.display = 'none'; }, 3500);
    }

    function displayItems(items) {
      itemsContainer.innerHTML = '';
      if (loadingMessage) loadingMessage.style.display = 'none';
      if (!items || Object.keys(items).length === 0) {
        itemsContainer.innerHTML = '<p class="message">No items found.</p>';
        return;
      }
      currentItemsMap = items;
      Object.keys(items).forEach(key => {
        const item = items[key];
        const itemDiv = document.createElement('div');
        itemDiv.className = 'item';
        itemDiv.innerHTML = `
          <h3>${item.name}</h3>
          <p>${item.description}</p>
          ${item.imageUrl ? `<img src="${item.imageUrl}" alt="${item.name}" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600&auto=format&fit=crop&q=80';" style="width:100%; height:180px; object-fit: cover; margin-bottom: 0.5rem; border-radius: 6px;" />` : ''}
          <p class="price">$${Number(item.price).toFixed(2)}</p>
          <div>
            <button class="buy-btn" data-key="${key}">Buy</button>
            <button class="cart-btn" data-key="${key}">Add to Cart</button>
          </div>
        `;
        itemsContainer.appendChild(itemDiv);
      });
    }

    // Event delegation for Buy and Add to Cart buttons
    itemsContainer.addEventListener('click', (e) => {
      const buyBtn = e.target.closest('.buy-btn');
      const cartBtn = e.target.closest('.cart-btn');

      if (buyBtn) {
        const key = buyBtn.getAttribute('data-key');
        const item = currentItemsMap[key];
        if (item) {
          if (window.MahiStore) {
            window.MahiStore.addToCart(item, 1);
          }
          window.location.href = 'cart.html';
        }
      } else if (cartBtn) {
        const key = cartBtn.getAttribute('data-key');
        const item = currentItemsMap[key];
        if (item) {
          if (window.MahiStore) {
            window.MahiStore.addToCart(item, 1);
          }
          updateCartBadge();
          showToast(item.name);
        }
      }
    });

    // Fetch and bind kids girls wear items with resilient store
    ZudioStore.bindCategory('kids_girls_wear', (data) => {
      displayItems(data);
    }, (error) => {
      console.warn('Realtime database sync error, fallback catalog active:', error);
    });

    // Authentication state handler
    auth.onAuthStateChanged(user => {
      const userNameDisplay = document.getElementById('userNameDisplay');
      const userPhoto = document.getElementById('userPhoto');
      if (user) {
        database.ref('users/' + user.uid).once('value').then(snapshot => {
          const data = snapshot.val();
          if (data && data.name) {
            userNameDisplay.textContent = `Hello, ${data.name}`;
          } else {
            userNameDisplay.textContent = `Hello, ${user.email ? user.email.split('@')[0] : 'User'}`;
          }
          if (data && data.photoUrl) {
            userPhoto.src = data.photoUrl;
            userPhoto.style.display = 'block';
          }
        }).catch(() => {
          userNameDisplay.textContent = `Hello, ${user.email ? user.email.split('@')[0] : 'User'}`;
        });
      } else {
        if (userNameDisplay) userNameDisplay.textContent = 'Guest';
      }
    });

    // Navigation buttons
    document.getElementById('mensWearBtn').addEventListener('click', () => {
      window.location.href = 'mens_wear.html';
    });
    document.getElementById('womensWearBtn').addEventListener('click', () => {
      window.location.href = 'womens.html';
    });
    document.getElementById('kidsBoysBtn').addEventListener('click', () => {
      window.location.href = 'kids_boys.html';
    });
    document.getElementById('kidsGirlsBtn').addEventListener('click', () => {
      window.location.href = 'kids_girls.html';
    });

    // Logout button
    document.getElementById('logoutBtn').addEventListener('click', () => {
      auth.signOut().then(() => {
        window.location.href = 'login.html';
      });
    });
  </script>
</body>
</html>
