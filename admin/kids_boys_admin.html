<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kids Boys Admin Page</title>
  <link rel="stylesheet" href="../theme-toggle.css" />
  <script src="../theme-toggle.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      padding: 2rem;
    }
    h2 {
      text-align: center;
      margin-bottom: 1rem;
    }
    form {
      max-width: 400px;
      margin: 0 auto;
      background: white;
      padding: 1rem;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input, textarea {
      width: 100%;
      padding: 0.5rem;
      margin-bottom: 1rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 1rem;
    }
    button {
      width: 100%;
      padding: 0.7rem;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
    }
    button:hover {
      background-color: #0056b3;
    }
    .message {
      text-align: center;
      margin-bottom: 1rem;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <nav style="display: flex; gap: 1rem; padding: 1rem; background-color: #007bff; color: white; font-weight: bold;">
    <button onclick="location.href='mens_admin.html'" style="background:none; border:none; color:white; cursor:pointer;">Mens Admin</button>
    <button onclick="location.href='womens_admin.html'" style="background:none; border:none; color:white; cursor:pointer;">Womens Admin</button>
    <button onclick="location.href='kids_boys_admin.html'" style="background:none; border:none; color:white; cursor:pointer;">Kids Boys Admin</button>
    <button onclick="location.href='kids_girls_admin.html'" style="background:none; border:none; color:white; cursor:pointer;">Kids Girls Admin</button>
    <button onclick="location.href='home.html'" style="background:none; border:none; color:white; cursor:pointer;">Home</button>
    <button onclick="location.href='login.html'" style="background:none; border:none; color:white; cursor:pointer;">Logout</button>
  </nav>
  <h2>Kids Boys Admin Page - Add Kids Boys Wear Item</h2>
  <form id="kidsBoysForm">
    <input type="text" id="name" placeholder="Item Name" required />
    <textarea id="description" placeholder="Description" rows="3" required></textarea>
    <input type="number" id="price" placeholder="Price" required min="0" step="0.01" />
    <input type="text" id="imageUrl" placeholder="Image URL (optional)" />
    <button type="submit">Add Item</button>
  </form>
  <div class="message" id="message"></div>

  <h3>Existing Items</h3>
  <div id="itemsList"></div>

  <!-- Firebase App (the core Firebase SDK) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <!-- Firebase Database -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <!-- Shared Store Adapter -->
  <script src="../shared-store.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCXdyiJmfEFPCQJwwjRDQfXt9RIKLTRpxU",
      authDomain: "amazom-d71c3.firebaseapp.com",
      projectId: "amazom-d71c3",
      storageBucket: "amazom-d71c3.firebasestorage.app",
      messagingSenderId: "1001190970236",
      appId: "1:1001190970236:web:625930553721a5fcba8af9",
      measurementId: "G-8CE41Q0YXC"
    };

    // Initialize Firebase
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const database = firebase.database();

    const kidsBoysForm = document.getElementById('kidsBoysForm');
    const messageDiv = document.getElementById('message');
    const itemsList = document.getElementById('itemsList');
    let editingKey = null;

    function renderItems(items) {
      itemsList.innerHTML = '';
      if (!items || Object.keys(items).length === 0) {
        itemsList.innerHTML = '<p>No items found in catalog.</p>';
        return;
      }
      Object.keys(items).forEach(key => {
        const item = items[key];
        const itemDiv = document.createElement('div');
        itemDiv.style.border = '1px solid #ccc';
        itemDiv.style.padding = '10px';
        itemDiv.style.marginBottom = '10px';
        itemDiv.style.borderRadius = '6px';
        itemDiv.innerHTML = `
          <strong>${item.name}</strong><br/>
          ${item.description}<br/>
          Price: $${Number(item.price).toFixed(2)}<br/>
          ${item.imageUrl ? `<img src="${item.imageUrl}" alt="${item.name}" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600&auto=format&fit=crop&q=80';" style="max-width:100px; max-height:100px; object-fit:cover; display:block; margin:5px 0; border-radius:4px;"/>` : ''}
          <button type="button" class="edit-btn" data-key="${key}">Edit</button>
          <button type="button" class="del-btn" data-key="${key}">Delete</button>
        `;
        itemsList.appendChild(itemDiv);
      });
    }

    // Event listener for edit and delete buttons
    itemsList.addEventListener('click', (e) => {
      const editBtn = e.target.closest('.edit-btn');
      const delBtn = e.target.closest('.del-btn');

      if (editBtn) {
        const key = editBtn.getAttribute('data-key');
        const catalog = window.ZudioStore.getAllProducts();
        const found = catalog.find(i => i._key === key && i._category === 'kids_boys_wear');
        if (found) {
          document.getElementById('name').value = found.name;
          document.getElementById('description').value = found.description;
          document.getElementById('price').value = found.price;
          document.getElementById('imageUrl').value = found.imageUrl || '';
          editingKey = key;
          kidsBoysForm.querySelector('button[type="submit"]').textContent = 'Update Item';
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      } else if (delBtn) {
        const key = delBtn.getAttribute('data-key');
        if (confirm('Are you sure you want to delete this item?')) {
          ZudioStore.deleteItem('kids_boys_wear', key, (success, msg) => {
            messageDiv.textContent = msg || 'Item deleted successfully!';
            messageDiv.style.color = 'green';
            if (editingKey === key) {
              kidsBoysForm.reset();
              editingKey = null;
              kidsBoysForm.querySelector('button[type="submit"]').textContent = 'Add Item';
            }
          });
        }
      }
    });

    function fetchItems() {
      ZudioStore.bindCategory('kids_boys_wear', (data) => {
        renderItems(data);
      });
    }

    kidsBoysForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const description = document.getElementById('description').value.trim();
      const price = parseFloat(document.getElementById('price').value);
      const imageUrl = document.getElementById('imageUrl').value.trim();

      if (!name || !description || isNaN(price)) {
        messageDiv.textContent = 'Please fill all fields correctly.';
        messageDiv.style.color = 'red';
        return;
      }

      const itemPayload = {
        name,
        description,
        price,
        imageUrl: imageUrl || ''
      };

      if (editingKey) {
        ZudioStore.updateItem('kids_boys_wear', editingKey, itemPayload, (success, msg) => {
          messageDiv.textContent = msg || 'Item updated successfully!';
          messageDiv.style.color = 'green';
          kidsBoysForm.reset();
          editingKey = null;
          kidsBoysForm.querySelector('button[type="submit"]').textContent = 'Add Item';
        });
      } else {
        ZudioStore.addItem('kids_boys_wear', itemPayload, (success, msg) => {
          messageDiv.textContent = msg || 'Item added successfully!';
          messageDiv.style.color = 'green';
          kidsBoysForm.reset();
        });
      }
    });

    fetchItems();
  </script>
</body>
</html>
